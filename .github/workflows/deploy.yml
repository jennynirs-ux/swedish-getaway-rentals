name: Build, prerender & publish

# Builds the site, prerenders it (needs Chrome, which ubuntu-latest has) and
# pushes the finished dist/ to the `cf-pages` branch. Cloudflare Pages is
# connected to that branch with no build command, so no API token is needed.

on:
  push:
    branches: [main]
  schedule:
    # Nightly, so prices, reviews and new properties reach the prerendered pages
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      # A failing check stops the deploy; the live site stays as it was
      - name: Type-check
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: bun run test
      - run: bun run build:prerender
      - name: Publish dist/ to the cf-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: cf-pages
          force_orphan: true
          commit_message: "Site build from ${{ github.sha }}"
