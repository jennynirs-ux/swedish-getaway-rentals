name: Build, prerender & deploy

on:
  push:
    branches: [main]
  schedule:
    # Nightly, so prices, reviews and new properties reach the prerendered pages
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome
      - run: bun run build:prerender
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # First run creates the Pages project; afterwards this is a no-op
          npx wrangler@3 pages project list | grep -q "nordic-getaways" \
            || npx wrangler@3 pages project create nordic-getaways --production-branch=main
          npx wrangler@3 pages deploy dist --project-name=nordic-getaways --branch=main --commit-dirty=true
